<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - MoroCation</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #10b981 0%, #059669 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .register-container { width: 100%; max-width: 400px; }
        .brand { text-align: center; margin-bottom: 32px; color: white; }
        .brand h1 { font-size: 32px; margin-bottom: 8px; }
        .brand p { opacity: 0.9; font-size: 16px; }
        .register-card { background: white; border-radius: 24px; padding: 32px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .register-card h2 { text-align: center; margin-bottom: 24px; color: #1f2937; font-size: 24px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; color: #374151; margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 14px 16px; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 15px; outline: none; transition: all 0.3s; }
        .form-group input:focus { border-color: #10b981; }
        .btn-register { width: 100%; padding: 16px; background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .btn-register:hover { opacity: 0.9; transform: translateY(-2px); }
        .login-link { text-align: center; margin-top: 20px; font-size: 14px; color: #6b7280; }
        .login-link a { color: #10b981; font-weight: 600; text-decoration: none; }
        .flash-messages { margin-bottom: 16px; }
        .flash { padding: 12px 16px; border-radius: 12px; font-size: 14px; margin-bottom: 8px; }
        .flash.error { background: #fee2e2; color: #991b1b; border: 1px solid #ef4444; }
        .flash.success { background: #d1fae5; color: #065f46; border: 1px solid #10b981; }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="brand">
            <h1>MC</h1>
            <p>MoroCation</p>
        </div>
        
        <div class="register-card">
            <h2>Créer un compte</h2>
            
            <!-- Flash messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="flash-messages">
                        {% for category, message in messages %}
                            <div class="flash {{ category }}">{{ message }}</div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}
            
            <!-- IMPORTANT: method="POST" w action="/register" -->
            <form method="POST" action="{{ url_for('register') }}">
                <div class="form-group">
                    <label>Nom complet</label>
                    <input type="text" name="nom" placeholder="Votre nom" required>
                </div>
                
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="votre@email.com" required>
                </div>
                
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" name="password" placeholder="Min. 6 caractères" required minlength="6">
                </div>
                
                <div class="form-group">
                    <label>Confirmer le mot de passe</label>
                    <input type="password" name="confirm_password" placeholder="Retapez le mot de passe" required>
                </div>
                
                <button type="submit" class="btn-register">
                    <i class="fas fa-user-plus"></i> S'inscrire
                </button>
            </form>
            
            <div class="login-link">
                Déjà un compte ? <a href="{{ url_for('login') }}">Se connecter</a>
            </div>
        </div>
    </div>
</body>
</html>
